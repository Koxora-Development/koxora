name: Desktop foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: apps/studio-desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
        working-directory: apps/studio-desktop/src-tauri
      - name: Build unsigned native bundle
        run: pnpm --filter @koxora/studio-desktop exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          NO_STRIP: 'true'
      - run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
        working-directory: apps/studio-desktop/src-tauri
      - run: cargo test --locked --target ${{ matrix.target }}
        working-directory: apps/studio-desktop/src-tauri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-desktop-${{ matrix.target }}
          path: apps/studio-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 7
  rust-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.93.1
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check licenses advisories sources
        working-directory: apps/studio-desktop/src-tauri

name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:docs
      - run: pnpm check:licenses
      - run: pnpm audit --audit-level high
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Linux'
        run: pnpm test:e2e
      # The contact endpoint is PHP behind the existing Apache, so the
      # toolchain production uses is installed here: PHP 8.4, PHP-FPM and
      # Apache. The website browser tests need it too, because they submit
      # the form to the real endpoint rather than to a stand-in.
      - if: runner.os == 'Linux'
        name: Install PHP 8.4, PHP-FPM and Apache
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            php8.4-cli php8.4-fpm php8.4-mbstring php8.4-curl \
            apache2 nginx-light libnginx-mod-http-js
          sudo update-alternatives --set php /usr/bin/php8.4
          php -v
      - if: runner.os == 'Linux'
        name: Install the contact endpoint dependencies
        working-directory: apps/contact-php
        run: composer install --no-interaction --no-progress --prefer-dist
      # Syntax first, on the version production runs, then the manifest, then
      # the advisories, then the suite.
      - if: runner.os == 'Linux'
        name: Check the contact endpoint
        working-directory: apps/contact-php
        run: |
          find public src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          composer validate --no-check-publish
          composer audit
          vendor/bin/phpunit --no-coverage
      - if: always() && runner.os == 'Linux'
        run: pnpm test:website
      # The generated container configuration is checked against a real NGINX
      # with the njs module, which is what decides the language in production.
      # Linux only: the check reports what is missing and passes elsewhere.
      - if: always() && runner.os == 'Linux'
        run: pnpm website:nginx
      # And the generated Apache fragment is checked against a real Apache
      # with PHP-FPM behind it, serving the real endpoint. An Alias after a
      # catch-all never fires and a misplaced <Files> grants too much; neither
      # shows up in a reading of the file.
      - if: always() && runner.os == 'Linux'
        run: pnpm website:apache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-validation-${{ matrix.os }}
          include-hidden-files: true
          path: |
            node_modules/.cache/koxora/playwright-report
            node_modules/.cache/koxora/website-report
            node_modules/.cache/koxora/test-results
            node_modules/.cache/koxora/website-results
            node_modules/.cache/koxora/dependency-licenses.json
          retention-days: 7

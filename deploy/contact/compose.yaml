# The contact delivery service. A separate file from the website's, so each
# can be built, started and rolled back without touching the other.
#
# From the repository root, with the settings in the environment or in a file
# the operator keeps outside this repository:
#   docker compose -f deploy/contact/compose.yaml --project-directory . \
#     --env-file /opt/koxora-website/contact.env up -d
#
# No credential belongs in this file, in the repository, or in an image.
name: koxora-contact
services:
  contact:
    image: koxora-contact:${KOXORA_CONTACT_TAG:-local}
    build:
      context: .
      dockerfile: deploy/contact/Dockerfile
    container_name: ${KOXORA_CONTACT_CONTAINER:-koxora-contact}
    restart: unless-stopped
    # Loopback only, as the website container is. The public Apache routes
    # the contact path here; nothing reaches it from outside the host.
    ports:
      - '127.0.0.1:${KOXORA_CONTACT_HOST_PORT:-9403}:8081'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Required. The service refuses to start without any of these.
      KOXORA_CONTACT_ALLOWED_ORIGINS: ${KOXORA_CONTACT_ALLOWED_ORIGINS:?set it to the site origin}
      KOXORA_CONTACT_RECIPIENT: ${KOXORA_CONTACT_RECIPIENT:?set it to the support mailbox}
      KOXORA_CONTACT_SENDER: ${KOXORA_CONTACT_SENDER:?set it to the address the service sends as}
      KOXORA_CONTACT_SMTP_HOST: ${KOXORA_CONTACT_SMTP_HOST:?set it to the mail server}
      KOXORA_CONTACT_SMTP_USER: ${KOXORA_CONTACT_SMTP_USER:?set it to the SMTP account}
      KOXORA_CONTACT_SMTP_PASSWORD: ${KOXORA_CONTACT_SMTP_PASSWORD:?set it in the environment, never in a file in this repository}
      # Optional, with the defaults the service documents.
      KOXORA_CONTACT_SMTP_PORT: ${KOXORA_CONTACT_SMTP_PORT:-465}
      KOXORA_CONTACT_SMTP_SECURE: ${KOXORA_CONTACT_SMTP_SECURE:-true}
      KOXORA_CONTACT_SUBJECT_PREFIX: ${KOXORA_CONTACT_SUBJECT_PREFIX:-[Koxora]}
      KOXORA_CONTACT_RATE_PER_CLIENT: ${KOXORA_CONTACT_RATE_PER_CLIENT:-3}
      KOXORA_CONTACT_RATE_GLOBAL: ${KOXORA_CONTACT_RATE_GLOBAL:-60}
      # The proxy in front sets the forwarded address, and it is the only
      # thing allowed to reach this container.
      KOXORA_CONTACT_TRUST_PROXY: ${KOXORA_CONTACT_TRUST_PROXY:-true}
      KOXORA_CONTACT_PORT: '8081'
      KOXORA_CONTACT_HOST: '0.0.0.0'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8081/api/contact/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

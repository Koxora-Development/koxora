[advisories]
version = 2
git-fetch-with-cli = true
[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "CC0-1.0", "Unicode-3.0", "MPL-2.0", "Zlib", "BSL-1.0"]
[licenses.private]
ignore = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
git-fetch-with-cli = true
# Informational maintenance advisory in Tauri's GTK proc-macro build chain.
# Independently reviewed; reassess on GTK/Tauri updates and before distribution.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "Maintenance-only consolidation into zbus 6; latest official single-instance 2.5.5 requires zbus 5. No patched compatible version. Independently reviewed 2026-11-09; reassess on plugin update and before release; docs/development/dependencies.md" },
  { id = "RUSTSEC-2026-0371", reason = "Maintenance-only consolidation into zbus 6; official single-instance requires zbus 5; independently reviewed 2026-11-09; reassess on plugin update and before release; docs/development/dependencies.md" },
  { id = "RUSTSEC-2026-0372", reason = "Maintenance-only consolidation into zbus 6; official single-instance requires zbus 5; independently reviewed 2026-11-09; reassess on plugin update and before release; docs/development/dependencies.md" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is an unmaintained build-time dependency of current GTK macros, with no patched version; tracked in docs/development/dependencies.md" }]
[licenses]
version = 2
confidence-threshold = 0.8
exceptions = [{ crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] }]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "CC0-1.0", "Unicode-3.0", "MPL-2.0", "Zlib"]
[licenses.private]
ignore = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"

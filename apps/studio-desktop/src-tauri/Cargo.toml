[package]
name = "koxora-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true

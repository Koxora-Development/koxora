[package]
name = "koxora-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
open = { version = "=5.4.5", features = ["shellexecute-on-windows"] }
url = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
